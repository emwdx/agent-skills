<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Changemakers — Course Skills Library</title>
  <script src="content.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-w: 256px;
      --bg: #ffffff;
      --sidebar-bg: #f6f5f1;
      --sidebar-border: #e4e2dc;
      --header-bg: #111110;
      --text: #18181b;
      --muted: #78716c;
      --hover: #eceae5;
      --active-bg: #18181b;
      --active-fg: #ffffff;
      --link: #2563eb;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      height: 50px;
      background: var(--header-bg);
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 10px;
      flex-shrink: 0;
      border-bottom: 1px solid #2a2a28;
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.75);
      padding: 3px 8px;
      border-radius: 4px;
    }
    .header-title { font-size: 15px; font-weight: 600; color: #fff; }
    .header-sep { color: rgba(255,255,255,0.25); font-weight: 300; }
    .header-sub { font-size: 13px; color: rgba(255,255,255,0.45); }

    /* ── Layout ── */
    .layout { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    aside {
      width: var(--sidebar-w);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      overflow-y: auto;
      flex-shrink: 0;
      padding: 8px 0 32px;
    }
    aside::-webkit-scrollbar { width: 4px; }
    aside::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 2px; }

    .nav-item {
      display: block;
      padding: 5px 12px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
      cursor: pointer;
      border-radius: 5px;
      margin: 1px 6px;
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav-item:hover { background: var(--hover); }
    .nav-item.active {
      background: var(--active-bg);
      color: var(--active-fg);
    }

    .nav-folder-hdr {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 12px 4px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      margin-top: 6px;
    }
    .nav-folder-hdr:hover { color: var(--text); }
    .toggle {
      font-size: 8px;
      width: 10px;
      flex-shrink: 0;
      opacity: 0.6;
    }

    /* ── Main ── */
    main {
      flex: 1;
      overflow-y: auto;
      background: var(--bg);
    }
    main::-webkit-scrollbar { width: 6px; }
    main::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 3px; }

    #content-wrap {
      max-width: 740px;
      padding: 52px 64px 96px;
    }

    /* ── Markdown typography ── */
    #doc h1 {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    #doc h2 {
      font-size: 16px;
      font-weight: 650;
      margin-top: 36px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--sidebar-border);
      letter-spacing: -0.005em;
    }
    #doc h3 {
      font-size: 14px;
      font-weight: 650;
      margin-top: 22px;
      margin-bottom: 6px;
    }
    #doc h4 {
      font-size: 13.5px;
      font-weight: 600;
      margin-top: 16px;
      margin-bottom: 4px;
      color: var(--muted);
    }
    #doc p {
      font-size: 14.5px;
      line-height: 1.72;
      margin-bottom: 14px;
      color: #27272a;
    }
    #doc ul, #doc ol {
      padding-left: 22px;
      margin-bottom: 14px;
    }
    #doc li {
      font-size: 14.5px;
      line-height: 1.65;
      margin-bottom: 5px;
      color: #27272a;
    }
    #doc li > p { margin-bottom: 6px; }
    #doc code {
      font-family: var(--mono);
      font-size: 12.5px;
      background: #f0eeea;
      color: #1a1a1a;
      padding: 2px 5px;
      border-radius: 3px;
    }
    #doc pre {
      background: #f6f5f1;
      border: 1px solid var(--sidebar-border);
      border-radius: 6px;
      padding: 16px 20px;
      overflow-x: auto;
      margin-bottom: 18px;
    }
    #doc pre code { background: none; padding: 0; font-size: 13px; }
    #doc blockquote {
      border-left: 3px solid #d4d0c8;
      padding: 6px 16px;
      color: var(--muted);
      margin-bottom: 14px;
    }
    #doc blockquote p { font-size: 14px; margin-bottom: 2px; color: var(--muted); }
    #doc hr {
      border: none;
      border-top: 1px solid var(--sidebar-border);
      margin: 28px 0;
    }
    #doc a { color: var(--link); text-decoration: none; }
    #doc a:hover { text-decoration: underline; }
    #doc strong { font-weight: 650; }

    /* ── Tables ── */
    #doc table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
      margin-bottom: 18px;
    }
    #doc th {
      text-align: left;
      font-weight: 600;
      padding: 9px 14px;
      background: var(--sidebar-bg);
      border: 1px solid var(--sidebar-border);
      font-size: 12.5px;
      letter-spacing: 0.01em;
    }
    #doc td {
      padding: 9px 14px;
      border: 1px solid var(--sidebar-border);
      vertical-align: top;
      line-height: 1.55;
    }
    #doc tr:nth-child(even) td { background: #faf9f7; }

    /* ── Task list checkboxes ── */
    #doc input[type=checkbox] {
      margin-right: 6px;
      accent-color: var(--text);
    }
    #doc li:has(input[type=checkbox]) {
      list-style: none;
      margin-left: -18px;
    }

    /* ── Frontmatter pill (shown above content) ── */
    .frontmatter-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      background: var(--sidebar-bg);
      border: 1px solid var(--sidebar-border);
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <header>
    <span class="badge">Grade 10</span>
    <span class="header-title">Changemakers</span>
    <span class="header-sep">/</span>
    <span class="header-sub">Course Skills Library</span>
  </header>
  <div class="layout">
    <aside>
      <nav id="tree"></nav>
    </aside>
    <main id="main">
      <div id="content-wrap">
        <div id="doc"></div>
      </div>
    </main>
  </div>

  <script>
    marked.use({ gfm: true, breaks: false });

    // Strip YAML frontmatter and return { meta, body }
    function parseFrontmatter(str) {
      const m = str.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
      if (!m) return { meta: {}, body: str.trimStart() };
      const meta = {};
      m[1].split('\n').forEach(line => {
        const [k, ...v] = line.split(':');
        if (k && v.length) meta[k.trim()] = v.join(':').trim();
      });
      return { meta, body: m[2].trimStart() };
    }

    let currentId = null;

    function renderDoc(doc) {
      currentId = doc.id;
      const { meta, body } = parseFrontmatter(doc.content);

      let html = '';
      if (meta.description) {
        html += `<div class="frontmatter-badge">Skill — ${meta.description}</div>`;
      }
      html += marked.parse(body);
      document.getElementById('doc').innerHTML = html;
      document.getElementById('main').scrollTop = 0;

      // Update active state
      document.querySelectorAll('#tree .nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id === doc.id);
      });

      // Ensure active item is visible
      const active = document.querySelector('#tree .nav-item.active');
      if (active) active.scrollIntoView({ block: 'nearest' });
    }

    function buildTree(items, container, depth) {
      items.forEach(item => {
        if (item.type === 'folder') {
          const wrap = document.createElement('div');

          const hdr = document.createElement('div');
          hdr.className = 'nav-folder-hdr';
          hdr.style.paddingLeft = (depth * 12 + 12) + 'px';

          const tog = document.createElement('span');
          tog.className = 'toggle';

          const lbl = document.createElement('span');
          lbl.textContent = item.title;

          hdr.appendChild(tog);
          hdr.appendChild(lbl);

          const kids = document.createElement('div');
          const open = depth === 0;
          kids.style.display = open ? 'block' : 'none';
          tog.textContent = open ? '▾' : '▸';

          hdr.addEventListener('click', () => {
            const isOpen = kids.style.display !== 'none';
            kids.style.display = isOpen ? 'none' : 'block';
            tog.textContent = isOpen ? '▸' : '▾';
          });

          if (item.children) buildTree(item.children, kids, depth + 1);

          wrap.appendChild(hdr);
          wrap.appendChild(kids);
          container.appendChild(wrap);
        } else {
          const el = document.createElement('div');
          el.className = 'nav-item';
          el.dataset.id = item.id;
          el.textContent = item.title;
          el.style.paddingLeft = (depth * 12 + 18) + 'px';
          el.title = item.title;
          el.addEventListener('click', () => renderDoc(item));
          container.appendChild(el);
        }
      });
    }

    function findFirst(items) {
      for (const item of items) {
        if (item.type !== 'folder') return item;
        if (item.children) {
          const found = findFirst(item.children);
          if (found) return found;
        }
      }
      return null;
    }

    document.addEventListener('DOMContentLoaded', () => {
      buildTree(DOCS, document.getElementById('tree'), 0);
      renderDoc(findFirst(DOCS));
    });
  </script>
</body>
</html>
